name: iOS Simulator Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/searealm-ios-cloud
    paths:
      - .github/workflows/ios-simulator.yml
      - apps/mobile/**
      - src/app/simulator/**
      - src/app/globals.css
      - src/components/**
      - src/data/**
      - src/lib/**
      - public/images/**
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    # Standard macOS compute is free for this public repository. Review billing
    # before enabling this job if the repository becomes private.
    if: github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 35
    env:
      CI: true
      SEAREALM_SIMULATOR_APP: ${{ runner.temp }}/searealm-derived/Build/Products/Debug-iphonesimulator/App.app
      SEAREALM_IOS_OUTPUT: ${{ runner.temp }}/searealm-ios-output
    steps:
      - name: Check out app source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - name: Report Apple build tools
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          mkdir -p "$SEAREALM_IOS_OUTPUT"

      - name: Install shared dependencies
        run: npm ci --no-audit --no-fund

      - name: Install app dependencies
        run: npm --prefix apps/mobile ci --no-audit --no-fund

      - name: Check saved progress and reward rules
        run: npm run mobile:test

      - name: Check simulator rules
        run: npm run test:simulator

      - name: Bundle offline game and sync native project
        run: npm run mobile:ios

      - name: Compile for Apple simulators
        run: |
          xcodebuild \
            -project apps/mobile/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/searealm-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$SEAREALM_IOS_OUTPUT/xcodebuild.log"
          # Ad-hoc signing lets Apple Silicon simulators run the local build.
          # This uses no Apple account and does not enable device installation.
          codesign --force --deep --sign - "$SEAREALM_SIMULATOR_APP"

      - name: Launch on iPhone and iPad simulators
        run: node apps/mobile/scripts/ios-simulator-smoke.mjs

      - name: Package simulator application
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$SEAREALM_SIMULATOR_APP" "$SEAREALM_IOS_OUTPUT/SeaRealm-simulator.zip"
          printf '%s\n' \
            'Built and launched SeaRealm on iPhone and iPad simulators.' \
            'The artifact is a simulator app, not a device-installable IPA or TestFlight build.' \
            'Apple Developer signing is still required for device distribution.' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Save build and simulator screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: searealm-ios-simulator-${{ github.run_number }}
          path: ${{ env.SEAREALM_IOS_OUTPUT }}
          if-no-files-found: warn
          retention-days: 3
