name: Art Drop Newsletter

on:
  push:
    branches:
      - main
    paths:
      - "public/images/cards/**/*.png"
  workflow_dispatch:
    inputs:
      files:
        description: "Newline-separated public image paths to announce"
        required: true
        type: string
      mode:
        description: "Create a draft or schedule sending"
        default: "draft"
        required: true
        type: choice
        options:
          - draft
          - send

jobs:
  create-broadcast:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Collect new art files
        id: art
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            printf '%s\n' "${{ inputs.files }}" > /tmp/art-files.txt
          else
            git diff --name-status HEAD^ HEAD -- 'public/images/cards/**/*.png' \
              | awk '$1 == "A" { print $2 }' > /tmp/art-files.txt
          fi

          if [[ ! -s /tmp/art-files.txt ]]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_files=true" >> "$GITHUB_OUTPUT"
          {
            echo "files<<EOF"
            cat /tmp/art-files.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Kit broadcast
        if: steps.art.outputs.has_files == 'true'
        env:
          ART_DROP_FILES: ${{ steps.art.outputs.files }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_BROADCAST_MODE: ${{ inputs.mode || vars.KIT_BROADCAST_MODE || 'draft' }}
          KIT_FROM_EMAIL: ${{ vars.KIT_FROM_EMAIL }}
          SITE_URL: ${{ vars.SITE_URL || 'https://seapalstcg.com' }}
        run: node scripts/create-art-drop-broadcast.mjs
