<svg xmlns="http://www.w3.org/2000/svg" width="469" height="657" viewBox="0 0 469 657" role="img" aria-labelledby="title description">
  <title id="title">Main deck card back</title>
  <desc id="description">A dark gray rounded card with the words Main Deck in white.</desc>
  <defs>
    <linearGradient id="card-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b626b"/>
      <stop offset="1" stop-color="#41474f"/>
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#101216" flood-opacity=".34"/>
    </filter>
    <filter id="text-shadow" x="-15%" y="-20%" width="130%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="2.5" flood-color="#111419" flood-opacity=".62"/>
    </filter>
  </defs>

  <rect x="8" y="7" width="453" height="641" rx="19" fill="url(#card-face)" stroke="#e8ebee" stroke-width="8" filter="url(#card-shadow)"/>
  <rect x="18" y="17" width="433" height="621" rx="12" fill="none" stroke="#ffffff" stroke-opacity=".13" stroke-width="2"/>

  <g fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="91" font-weight="800" text-anchor="middle" filter="url(#text-shadow)">
    <text x="234.5" y="307" letter-spacing="1.5">MAIN</text>
    <text x="234.5" y="414" letter-spacing="1.5">DECK</text>
  </g>
</svg>
