<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="oceanic-dive-title oceanic-dive-desc">
  <title id="oceanic-dive-title">Pelagic Rush Oceanic Set Dive Pack</title>
  <desc id="oceanic-dive-desc">A bright blue SeaPals Dive Pack illustration decorated with rolling waves and a fast-moving school of ocean fish.</desc>
  <defs>
