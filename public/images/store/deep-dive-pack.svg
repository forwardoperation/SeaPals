    <text x="400" y="124" text-anchor="middle" fill="#dffff9" font-family="Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="3">SEAPALS TCG</text>
    <text x="400" y="424" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="23" font-weight="900" letter-spacing="2.5">DEEP SET</text>
    <rect x="310" y="439" width="180" height="29" rx="14.5" fill="#7fffee"/>
    <text x="400" y="459" text-anchor="middle" fill="#061a33" font-family="Arial, sans-serif" font-size="14" font-weight="900" letter-spacing="2">DIVE PACK</text>
  </g>

  <g transform="translate(242 519)">
    <rect width="316" height="54" rx="27" fill="#061a33"/>
    <text x="158" y="35" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="23" font-weight="800" letter-spacing="2.8">ABYSSAL GLOW</text>
