      <path d="m80 21 30-22-5 33 7 30-32-18Z" fill="#143d65" stroke="#061a33" stroke-width="6" stroke-linejoin="round"/>
      <path d="M35 3c4-22 21-29 38-17" fill="none" stroke="#7fffee" stroke-width="5" stroke-linecap="round"/>
      <circle cx="76" cy="-12" r="6" fill="#f7c948" filter="url(#deep-dive-glow)"/>
